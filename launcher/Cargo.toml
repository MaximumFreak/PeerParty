[package]
name = "peerparty"
description = "Starts a game with peerparty_hook.dll injected"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Room codes and the internet check (--new-room, --net-test, the Settings page).
peerparty_core = { path = "../core" }
# What the launcher and the hook agree on: messages, the frame block, the catalog.
peerparty_protocol = { path = "../protocol" }
# The launcher window (src/ui), shown when peerparty.exe starts with no arguments.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "links"] }
egui_extras = { version = "0.37", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checking a downloaded update against its release checksum (src/release.rs).
sha2 = "0.10"

# The Win32 side (backend/windows, platform/windows.rs, host's windows and hooks).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Devices_Display", "Win32_Storage_Packaging_Appx", "Win32_System_JobObjects", "Win32_Security_Authorization", "Win32_Networking_WinHttp"] }

# Linux and other Unix systems: mmap for the overlay's frame file, evdev controllers,
# process checks (backend/linux, platform/linux.rs); the window through X11 or Wayland.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

# The version number in peerparty.exe's file properties (build.rs), when built on
# Windows (build.rs runs on the building system, so this is the host's, not the target's).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
