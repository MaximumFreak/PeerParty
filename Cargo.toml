[workspace]
resolver = "3"
members = ["launcher", "hook", "core", "protocol"]

[workspace.package]
# Tagged `v<version>` in git; peerparty.exe adds the commits since that tag (launcher/build.rs).
version = "0.5.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# retour 0.3.1 writes a relocated RIP displacement over the last four bytes of the
# instruction, which corrupts `cmp dword [rip+d], imm8` and crashed a game.
# The vendored copy finds the real displacement offset. It also takes its two locks
# whether or not a panic once happened while one was held (the disassembler panics on
# bytes it doesn't know): poisoned, every later hook in the game failed. A dropped
# detour is disabled in release builds too (upstream's disable sat in a debug_assert!).
# And on Windows, enabling or disabling calls VirtualProtect directly with stack-only
# state instead of region::protect_with_handle (which allocates a Vec on the process
# heap and deadlocks when called with other threads suspended via sys::hook::frozen).
[patch.crates-io]
retour = { path = "vendor/retour" }

# `cargo build` and `cargo test`. Line tables only: backtraces and panics still name
# files and lines, but there are no variable types for a debugger, which made most of
# the target folder (over 50 GB of debug builds) and most of each link's work.
[profile.dev]
debug = "line-tables-only"

# Dependencies optimized: the crypto, Opus and UI crates were the slow part of a test
# run unoptimized, and they're compiled once (they don't change with our code).
[profile.dev.package."*"]
opt-level = 2

# Optimized for size: most of the code (the UI, the SDK stand-ins, the control plane)
# is cold, and every byte of the hook is paid twice in peerparty.exe (x64 and x86) and
# again in each game's memory. The crates that do sustained work per packet or per
# sample keep full speed below.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Voice: encoding and decoding every 20 ms frame.
[profile.release.package.rusty-opus]
opt-level = 3
# The internet tunnel's per-packet AEAD and the handshakes.
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
# Cover art decoding in the launcher.
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.image]
opt-level = 2
# Inflating the embedded hooks, and (as a build dependency, which this also reaches)
# compressing them in launcher/build.rs on every hook change.
[profile.release.package.miniz_oxide]
opt-level = 3

# What tests/run_all.ps1 builds and runs. Same optimizations as release, without
# link-time optimization and with incremental compilation, so a hook change doesn't
# rebuild the suite's exe the slow way. The shipping exe stays on `release`.
[profile.testexe]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
