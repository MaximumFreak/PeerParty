[package]
name = "peerparty_hook"
description = "Injected into the game: watches SDK modules and hooks their exports"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
peerparty_core = { path = "../core" }
retour = "0.3.1"
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange"] }
