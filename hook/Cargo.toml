[package]
name = "peerparty_hook"
description = "Injected into the game: watches SDK modules and hooks their exports"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
peerparty_core = { path = "../core" }
peerparty_protocol = { path = "../protocol" }
retour = "0.3.1"
# Voice (voice.rs): Opus in pure Rust, so the hook needs no C toolchain or codec DLL.
# Its packet parsing and decoding are safe Rust (unsafe only in its SIMD kernels, each
# guarded where it is called): it reads other players' packets inside the game.
rusty-opus = "=1.1.1"
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Pipes", "Win32_System_Environment"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Tests claim their ports from core's allocator (core/src/test_ports.rs).
peerparty_core = { path = "../core", features = ["test-util"] }
